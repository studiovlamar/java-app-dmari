name: ci-cd-eb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  EB_APP: skillbrain-app
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build_test_package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Create EB bundle
        run: |
          JAR_FILE=$(ls target/*.jar | head -n1)
          cp "$JAR_FILE" application.jar
          zip -r bundle.zip Procfile application.jar

      - uses: actions/upload-artifact@v4
        with:
          name: eb-bundle
          path: bundle.zip

  deploy_staging:
    needs: build_test_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eb-bundle

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk staging
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APP }}
          environment_name: skillbrain-env-staging
          version_label: staging-${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: bundle.zip

  healthcheck_staging:
    needs: deploy_staging
    runs-on: ubuntu-latest
    steps:
      - name: Health check staging
        run: |
          curl -fsSL "http://skillbrain-env-staging.eba-srdwessj.eu-west-3.elasticbeanstalk.com/" > /dev/null

  deploy_prod:
    needs: healthcheck_staging
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eb-bundle

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk production
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APP }}
          environment_name: skillbrain-env-prod
          version_label: prod-${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: bundle.zip

  healthcheck_prod:
    needs: deploy_prod
    runs-on: ubuntu-latest
    steps:
      - name: Health check prod
        run: |
          curl -fsSL "http://skillbrain-env-prod.eba-srdwessj.eu-west-3.elasticbeanstalk.com/" > /dev/null